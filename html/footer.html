<!-- footer.html -->
<style>
    /* 页脚相关样式 */
    footer {
        background-color: var(--bg-card);
        border-top: 1px solid var(--border-color);
        padding: 2rem 0;
        margin-top: 2rem;
    }

    .footer-grid {
        display: grid;
        align-items: center !important;
        justify-content: center !important;
        gap: 2rem !important;
        grid-template-columns: auto auto auto !important;
        width: 100% !important;
    }

    .footer-content {
        max-width: 1200px !important;
        width: 100% !important;
        padding: 0 1.5rem !important;
        margin: 0 auto !important;
    }

    .footer-content p {
        margin: 0 !important;
        font-size: 0.8rem !important;
        color: var(--muted-color) !important;
        line-height: 1 !important;
    }

    .footer-content ul {
        display: flex;
        gap: 1.2rem;
        list-style: none;
        padding: 0 !important;
        margin: 0 !important;
        align-items: center;
        line-height: 1 !important;
    }

    .footer-content a {
        font-size: 0.8rem !important;
        color: var(--muted-color) !important;
        text-decoration: none !important;
        line-height: 1 !important;
    }

    .footer-content a:hover {
        color: var(--primary) !important;
    }

    /* 社交链接 */
    .footer-content .fa-weixin,
    .footer-content .fa-github {
        font-size: 1.1rem !important;
        color: var(--text-highlight) !important;
        line-height: 1 !important;
    }

    .footer-content .wechat-link {
        display: flex !important;
        align-items: center !important;
        gap: 0.4rem !important;
    }

    .wechat-link {
        color: var(--primary);
        font-size: 1.5rem;
    }

    .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-size: 0.85rem;
        white-space: nowrap;
    }

    .theme-toggle-label {
        line-height: 1;
    }

    .theme-toggle-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.2rem;
        height: 2.2rem;
        padding: 0;
        margin: 0;
        border: 1px solid var(--border-color);
        border-radius: 999px;
        background: var(--bg-card);
        color: var(--text-highlight);
        cursor: pointer;
        box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .theme-toggle-btn:hover {
        transform: translateY(-1px);
        border-color: var(--primary);
        box-shadow: 0 6px 16px rgba(79, 70, 229, 0.16);
    }

    .theme-toggle-btn:focus-visible {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
    }

    .theme-toggle-btn i {
        font-size: 1rem;
        line-height: 1;
        pointer-events: none;
    }

    /* --- 移动端导航栏适配 --- */
    /* 默认（桌面端）：隐藏汉堡按钮 */
    @media (max-width: 992px) {
        .footer-grid {
            grid-template-columns: 1fr !important;
            gap: 1.5rem !important;
            text-align: center !important;
        }

        .theme-toggle {
            margin-left: 0 !important;
            justify-content: center !important;
        }

        /* --- 底部 Footer 手机端适配 --- */
        /* 1. 整体布局：单列显示，增加大模块之间的间距 */
        .footer-grid {
            grid-template-columns: 1fr !important;
            /* 强制单列 */
            gap: 2rem !important;
            /* 版权、链接、图标三组之间拉开距离 */
            text-align: center !important;
        }

        /* 2. 导航链接列表：从“横排”改为“竖排” */
        .footer-content ul {
            flex-direction: column !important;
            /* 核心：垂直排列 */
            gap: 1.2rem !important;
            /* 每个链接之间的间距 */
        }

        /* 3. 单个链接项：放大点击区域，防止误触 */
        .footer-content a {
            font-size: 1rem !important;
            /* 手机上字号稍微大一点 */
            display: block;
            /* 变为块级元素，方便点击 */
            padding: 0.2rem 0;
            /* 增加手指点击范围 */
        }

        /* 4. 社交图标栏 ：强制水平居中 */
        /* 选中 footer-grid 里的最后一个 div */
        .footer-grid>div:last-child {
            justify-content: center !important;
            /* Flex 居中 */
            width: 100% !important;
        }

        /* 5. 主题切换按钮微调 */
        .theme-toggle {
            margin-left: 0 !important;
            justify-content: center !important;
            transform: scale(1.1);
            /* 稍微放大一点开关，方便手指拨动 */
        }
    }
</style>

<!-- 页脚内容 -->
<footer>
    <div class="footer-content">
        <div class="footer-grid">
            <!-- 左列：版权信息 -->
            <div style="text-align: center;">
                <p>©2026 purecpp.cn 粤ICP备2022099661号-1</p>
            </div>

            <!-- 中列：导航链接 + 主题按钮 -->
            <ul>
                <li><a href="/about.html">关于我们</a></li>
                <li><a href="/rules.html">社区守则</a></li>
                <!-- 主题切换按钮 -->
                <li class="theme-toggle">
                    <span class="theme-toggle-label">主题</span>
                    <button type="button" id="themeToggleBtn" class="theme-toggle-btn" aria-label="切换到深色主题" title="切换主题">
                        <i class="fas fa-sun" aria-hidden="true"></i>
                    </button>
                </li>
            </ul>

            <!-- 右列：微信公众号 + GitHub -->
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <img src="images/公众号.jpg" alt="微信公众号" title="扫码关注微信公众号" style="width:36px; height:36px; border-radius:8px; vertical-align:middle;">
                <a href="https://github.com/qicosmos" title="GitHub">
                    <i class="fab fa-github"></i>
                </a>
            </div>
        </div>
    </div>
</footer>
